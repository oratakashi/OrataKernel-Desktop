name: Sync Upstream Linux

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  sync:
    name: Pull & merge torvalds/linux:master
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate branch name
        id: branch
        run: |
          DATE=$(date +'%-d-%b-%y' | tr '[:upper:]' '[:lower:]')
          echo "name=automate/${DATE}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: mainline
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/torvalds/linux.git
          git fetch upstream master

      - name: Create automate branch and merge upstream
        run: |
          git checkout -b "${{ steps.branch.outputs.name }}"
          git merge upstream/master --no-edit --allow-unrelated-histories

      - name: Push automate branch
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = '${{ steps.branch.outputs.name }}';
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              base: 'mainline',
              state: 'open',
            });

            if (prs.length > 0) {
              core.info(`Pull request already exists: ${prs[0].html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sync: merge torvalds/linux:master → mainline (${branch})`,
              head: branch,
              base: 'mainline',
              body: [
                '## Automated Upstream Sync',
                '',
                `This pull request was created automatically by the **Sync Upstream Linux** workflow.`,
                '',
                `| Field | Value |`,
                `|-------|-------|`,
                `| Source | \`torvalds/linux:master\` |`,
                `| Target | \`mainline\` |`,
                `| Branch | \`${branch}\` |`,
                `| Date   | ${new Date().toUTCString()} |`,
              ].join('\n'),
            });

            core.info(`Pull request created: ${pr.html_url}`);
